# make.fun News 23 build — CODEX/Xingchi ONLY, one wallet per run.
# Primary lane since 25 Nov 04:53 WIB (Ariel): Xingchi/Codex, 20 lanes.
# The HMS workflow news23-build.yml is the FALLBACK — do NOT change it.
# Secrets required (set by hand, never committed):
#   XINGCHI_API_KEY    — base Xingchi key (20 Nov)
#   XINGCHI_API_KEY_1..10 — Xingchi keys (21 Nov)
#   XINGCHI_API_KEY_11..20 — Xingchi keys XC-12..XC-21 (24 Nov)
#     Slot from wallet number: (N-1)%21; slot 0 = base, 1..20 = numbered.
#     21 keys for 20 lanes = 1 key per lane + 1 spare.
#   ARCHIVE_PASSPHRASE — passphrase for credentials.tar.gz.gpg
# No secret is ever echoed, printed, or uploaded as an artifact.
name: makefun-news23-codex-build

on:
  workflow_dispatch:
    inputs:
      wallet:
        description: "Wallet number, e.g. 210"
        required: true
        default: "210"
      wallet_address:
        description: "Solana wallet address (public)"
        required: true
        default: "EfRoY8nU755DppBCbCZ1V3D652vRSkUtZ4b7veqfeAuR"
      referral:
        description: "Referral code used at register (empty if account already registered)"
        required: false
        default: "p346xfan"
      title:
        description: "Submission title"
        required: false
        default: "Monday 23 November 2026 — COP31 collapses, Democrats win 258 seats: 25 stories"

permissions:
  contents: write # push result JSON to the `results` branch
  actions: read

# One wallet = one lane. Never cancel a running build/submit.
concurrency:
  group: news23-codex-wallet-${{ inputs.wallet }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Codex lane worst case ~60 min
    env:
      WALLET_N: ${{ inputs.wallet }}
      WALLET_ADDR: ${{ inputs.wallet_address }}
      REFERRAL: ${{ inputs.referral }}
      COMP: news-image-20261123
      TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build one entry (Codex/Xingchi only)
        env:
          XINGCHI_API_KEY: ${{ secrets.XINGCHI_API_KEY }}
          XINGCHI_API_KEY_1: ${{ secrets.XINGCHI_API_KEY_1 }}
          XINGCHI_API_KEY_2: ${{ secrets.XINGCHI_API_KEY_2 }}
          XINGCHI_API_KEY_3: ${{ secrets.XINGCHI_API_KEY_3 }}
          XINGCHI_API_KEY_4: ${{ secrets.XINGCHI_API_KEY_4 }}
          XINGCHI_API_KEY_5: ${{ secrets.XINGCHI_API_KEY_5 }}
          XINGCHI_API_KEY_6: ${{ secrets.XINGCHI_API_KEY_6 }}
          XINGCHI_API_KEY_7: ${{ secrets.XINGCHI_API_KEY_7 }}
          XINGCHI_API_KEY_8: ${{ secrets.XINGCHI_API_KEY_8 }}
          XINGCHI_API_KEY_9: ${{ secrets.XINGCHI_API_KEY_9 }}
          XINGCHI_API_KEY_10: ${{ secrets.XINGCHI_API_KEY_10 }}
          XINGCHI_API_KEY_11: ${{ secrets.XINGCHI_API_KEY_11 }}
          XINGCHI_API_KEY_12: ${{ secrets.XINGCHI_API_KEY_12 }}
          XINGCHI_API_KEY_13: ${{ secrets.XINGCHI_API_KEY_13 }}
          XINGCHI_API_KEY_14: ${{ secrets.XINGCHI_API_KEY_14 }}
          XINGCHI_API_KEY_15: ${{ secrets.XINGCHI_API_KEY_15 }}
          XINGCHI_API_KEY_16: ${{ secrets.XINGCHI_API_KEY_16 }}
          XINGCHI_API_KEY_17: ${{ secrets.XINGCHI_API_KEY_17 }}
          XINGCHI_API_KEY_18: ${{ secrets.XINGCHI_API_KEY_18 }}
          XINGCHI_API_KEY_19: ${{ secrets.XINGCHI_API_KEY_19 }}
          XINGCHI_API_KEY_20: ${{ secrets.XINGCHI_API_KEY_20 }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/run-news23-codex.sh

      - name: Upload build artifacts (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-${{ inputs.wallet }}-news23-codex
          path: |
            work/result*.json
            work/submit-w${{ inputs.wallet }}-news23.out
            work/submit-w${{ inputs.wallet }}-news23.err
            work/finish-w${{ inputs.wallet }}-news23.log
            work/build.log
            work/codex-run.log
            work/opencode-run.log
            work/init-w${{ inputs.wallet }}.log
            work/register-w${{ inputs.wallet }}.out
            work/register-w${{ inputs.wallet }}.err
            work/prompt-w${{ inputs.wallet }}-news23.txt
            work/push-results.out
            work/codex-npm/wallet-${{ inputs.wallet }}-news-image-20261123/
            work/bundle-news23-w${{ inputs.wallet }}.tar.gz
            work/wallet-${{ inputs.wallet }}-news-image-20261123/entry.png
          if-no-files-found: warn
          retention-days: 7
