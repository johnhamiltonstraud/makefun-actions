# make.fun News 20 build — one wallet per run, GitHub-hosted runner.
# Private repo: runs draw from the account's $12/month included compute
# (= 2,000 standard Linux minutes). ~10-15 min per build, so ~130-200 builds
# fit in one month's allowance. Repo MUST stay private: it holds an encrypted
# credentials archive (ciphertext) and job logs.
# Secrets required (set by deploy.sh, never committed):
#   XINGCHI_API_KEY    — Xingchi key for Codex model gpt-6.1-sol (fallback)
#   XINGCHI_API_KEY_1..10 — one different Xingchi key per slot; each build
#     picks a slot by wallet number so 20 parallel jobs share 10 keys
#     (2 jobs per key) instead of hammering one key into 429s (batch 21).
#     Unset slots fall back to XINGCHI_API_KEY, so jobs keep working
#     while slots are being filled.
#   ARCHIVE_PASSPHRASE — passphrase for credentials.tar.gz.gpg
# No secret is ever echoed, printed, or uploaded as an artifact.
name: makefun-news20-build

on:
  workflow_dispatch:
    inputs:
      wallet:
        description: "Wallet number, e.g. 210"
        required: true
        default: "210"
      wallet_address:
        description: "Solana wallet address (public)"
        required: true
        default: "EfRoY8nU755DppBCbCZ1V3D652vRSkUtZ4b7veqfeAuR"
      referral:
        description: "Referral code used at register (empty if account already registered)"
        required: false
        default: "p346xfan"
      title:
        description: "Submission title"
        required: false
        default: "Friday 20 November 2026 — Trilateral Shenzhen summit, ICJ verdict, Akvan landfall"

permissions:
  contents: write # push result JSON to the `results` branch
  actions: read

# One wallet = one lane. Never cancel a running build/submit.
concurrency:
  group: news20-wallet-${{ inputs.wallet }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WALLET_N: ${{ inputs.wallet }}
      WALLET_ADDR: ${{ inputs.wallet_address }}
      REFERRAL: ${{ inputs.referral }}
      COMP: news-image-20261120
      TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build one entry
        env:
          XINGCHI_API_KEY: ${{ secrets.XINGCHI_API_KEY }}
          XINGCHI_API_KEY_1: ${{ secrets.XINGCHI_API_KEY_1 }}
          XINGCHI_API_KEY_2: ${{ secrets.XINGCHI_API_KEY_2 }}
          XINGCHI_API_KEY_3: ${{ secrets.XINGCHI_API_KEY_3 }}
          XINGCHI_API_KEY_4: ${{ secrets.XINGCHI_API_KEY_4 }}
          XINGCHI_API_KEY_5: ${{ secrets.XINGCHI_API_KEY_5 }}
          XINGCHI_API_KEY_6: ${{ secrets.XINGCHI_API_KEY_6 }}
          XINGCHI_API_KEY_7: ${{ secrets.XINGCHI_API_KEY_7 }}
          XINGCHI_API_KEY_8: ${{ secrets.XINGCHI_API_KEY_8 }}
          XINGCHI_API_KEY_9: ${{ secrets.XINGCHI_API_KEY_9 }}
          XINGCHI_API_KEY_10: ${{ secrets.XINGCHI_API_KEY_10 }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/run-news20.sh

      - name: Upload build artifacts (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-${{ inputs.wallet }}-news20
          path: |
            work/result*.json
            work/submit-w${{ inputs.wallet }}-news20.out
            work/submit-w${{ inputs.wallet }}-news20.err
            work/finish-w${{ inputs.wallet }}-news20.log
            work/build.log
            work/codex-run.log
            work/init-w${{ inputs.wallet }}.log
            work/register-w${{ inputs.wallet }}.out
            work/register-w${{ inputs.wallet }}.err
            work/prompt-w${{ inputs.wallet }}-news20.txt
            work/push-results.out
            work/codex-npm/wallet-${{ inputs.wallet }}-news-image-20261120/
            work/bundle-news20-w${{ inputs.wallet }}.tar.gz
            work/wallet-${{ inputs.wallet }}-news-image-20261120/entry.png
          if-no-files-found: warn
          retention-days: 7
